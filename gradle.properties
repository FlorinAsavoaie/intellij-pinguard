# The plugin's name, repository URL and version are deliberately absent: they are
# declared once each in META-INF/plugin.xml, in GitHubIssueUrl.kt, and by the release
# tag. See build.gradle.kts for how a build is told which version it is producing.
pluginGroup = tech.florin.pinguard

# 253 is where JetBrains documents split-mode plugin development. The content
# module this plugin ships loads on older builds too, but nothing there is
# supported, and `runIdeSplitMode` — the only way to actually exercise a
# frontend module — needs 2025.3.
pluginSinceBuild = 253

# No platformType any more: IDEA is published as one distribution from 2025.3,
# so build.gradle.kts asks for `intellijIdea` directly.
platformVersion = 2025.3.6.1

kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching = true
org.gradle.parallel = true
