name: Release

on:
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    environment: Marketplace
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true

      - name: Read the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^v[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}(-(alpha|beta|eap|rc)(\.[0-9]{1,9})?)?$ ]]; then
            echo "Release tag ${TAG_NAME} is not a version this project can publish." >&2
            echo "Expected vX.Y.Z, optionally followed by -alpha, -beta, -eap or -rc and a number." >&2
            echo "Recover with: gh release delete ${TAG_NAME} --cleanup-tag --yes" >&2
            exit 1
          fi

          if [[ "$TAG_NAME" =~ -(alpha|beta|eap|rc) ]]; then suffixed=true; else suffixed=false; fi
          if [ "$suffixed" != "$IS_PRERELEASE" ]; then
            echo "This release is marked prerelease=${IS_PRERELEASE} on GitHub, but ${TAG_NAME} says ${suffixed}." >&2
            echo "The version suffix is what picks the Marketplace channel, so the two must agree." >&2
            exit 1
          fi

          # Read live rather than from the event payload: a re-run replays the payload
          # it was triggered with, so a body fixed after a failure would never be seen.
          mkdir -p build
          gh release view "$TAG_NAME" --json body --jq .body > build/release-notes.md
          if ! grep -q '[^[:space:]]' build/release-notes.md; then
            echo "The release body is empty, and it is what users read as the change notes." >&2
            echo "Write the notes on the release page, then re-run this workflow." >&2
            exit 1
          fi

          echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Check release credentials
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$PUBLISH_TOKEN" ] || missing="${missing} PUBLISH_TOKEN"
          [ -n "$CERTIFICATE_CHAIN" ] || missing="${missing} CERTIFICATE_CHAIN"
          [ -n "$PRIVATE_KEY" ] || missing="${missing} PRIVATE_KEY"
          [ -n "$PRIVATE_KEY_PASSWORD" ] || missing="${missing} PRIVATE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing secrets on the Marketplace environment:${missing}." >&2
            echo "Without the signing three, signPlugin skips itself and publishPlugin refuses to upload." >&2
            exit 1
          fi

      - name: Test
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: frontend/build/reports/tests/test
          if-no-files-found: error

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Attach plugin archive to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          ARCHIVES=(build/distributions/*-"${PLUGIN_VERSION}"-signed.zip)
          if [ ${#ARCHIVES[@]} -ne 1 ]; then
            echo "Expected one signed archive for ${PLUGIN_VERSION} in build/distributions, found ${#ARCHIVES[@]}." >&2
            echo "The plugin is already live on Marketplace; only this attachment failed." >&2
            exit 1
          fi
          gh release upload "$TAG_NAME" "${ARCHIVES[0]}" --clobber
